# DS-SGen Baseline Configuration
# Validated against: Lee et al., "Selective Generation for Controllable LMs" (NeurIPS 2024)

# === Paths ===
paths:
  model: "/data/user_data/anshulk/dsgen/model_cache/Llama-3.1-8B-Instruct"
  entailment_model: "microsoft/deberta-v2-xxlarge-mnli"  # 1.5B params, label order: {0:CONTRADICTION, 1:NEUTRAL, 2:ENTAILMENT}
  cache_dir: "/data/user_data/anshulk/dsgen/cache"
  results_dir: "/data/user_data/anshulk/dsgen/results"
  hf_cache: "/data/user_data/anshulk/dsgen/model_cache"

# === Datasets ===
data:
  nq_dataset: "google-research-datasets/nq_open"   # NOT "nq_open" — full namespaced ID required
  nq_split: "validation"                            # 3,610 questions; fields: question (str), answer (list[str])
  tqa_dataset: "mandarjoshi/trivia_qa"              # NOT "trivia_qa" — full namespaced ID required
  tqa_config: "unfiltered.nocontext"                # Skips 29GB doc download; same questions/answers as "unfiltered"
  tqa_split: "validation"                           # 11,313 questions
  tqa_sample_size: 3610                             # Downsample to match NQ size
  sample_seed: 42

# === LLM Generation ===
generation:
  system_prompt: "Answer the following question concisely in one sentence."  # Used with chat template
  max_new_tokens: 100
  num_samples: 5                   # K=5, matches SGen paper
  temperature: 0.7
  batch_size: 1                    # Start with 1, increase if VRAM allows
  save_every: 50                   # Incremental cache save frequency

# === Entailment Scoring ===
entailment:
  # DeBERTa-v2-xxlarge-mnli: id2label = {0:CONTRADICTION, 1:NEUTRAL, 2:ENTAILMENT}
  # NOTE: cross-encoder/nli-deberta-v3-large has DIFFERENT order: {0:contradiction, 1:entailment, 2:neutral}
  entailment_idx: 2                # Index of ENTAILMENT class in logits
  batch_size: 64                   # ~6GB total VRAM at batch 64, safe on A6000 50GB
  clustering_method: "bidirectional_argmax"   # For self-consistency: both NLI(i→j) and NLI(j→i) must be ENTAILMENT
  correctness_method: "unidirectional_argmax" # For correctness: NLI(greedy→reference) must be ENTAILMENT

# === SGen-Semi Algorithm ===
sgen:
  epsilon: 0.25                    # Target FDR-E level (paper's main experimental setting)
  delta: 0.02                      # PAC confidence (1-delta = 0.98), matches paper experiments
  delta_p: 1.0e-5                  # Pseudo-labeling failure prob; subtracted from delta before Bonferroni
  cal_frac: 0.70                   # Fraction of calibration dataset for calibration (rest = in-domain test)
  zu_frac: 0.75                    # Fraction of calibration as unlabeled Z_U (rest = labeled Z_E)
  epsilon_e: 0.05                  # Conformal pseudo-labeling error rate (stricter for better pseudo-labels)
  n_splits: 100                    # Number of random calibration splits
  n_grid: 20                       # Percentile-based grid points per score (fewer = less Bonferroni penalty)
  # Calibration: TQA (higher correctness 61%, stronger feature correlation r=0.45)
  # Shifted test: NQ (lower correctness 40%, weaker feature correlation r=0.34)
  # Selection: fM1-only (1D threshold, |H|=20 instead of 20*9=180)
  cal_dataset: "tqa"               # Which dataset to calibrate on: "nq" or "tqa"
  selection_mode: "fm1_only"       # "fm1_only", "fm2_only", or "both"

# === Method 2: Conservative Threshold ===
# Three options for naive domain-shift handling (all sweep over parameter values):
conservative:
  # Option A: safety factor on thresholds after grid search
  #   tau1 += log(gamma)  [fM1 is log-scale]
  #   tau2 *= gamma       [fM2 in [0,1]]
  safety_factors: [1.0, 1.2, 1.5, 2.0]

  # Option B: reduced epsilon in grid search (divisor applied to sgen.epsilon)
  #   eps_effective = epsilon / k
  #   Evaluate validity against original epsilon for fair comparison
  epsilon_divisors: [1.0, 1.5, 2.0, 3.0, 4.0]

  # Option C: delta budget allocation for potential shift
  #   delta_s = frac * (delta - delta_p)
  #   Remaining delta_cp = delta - delta_p - delta_s drives Clopper-Pearson bounds
  delta_shift_fracs: [0.0, 0.25, 0.50, 0.75]

  # Number of splits (null = use sgen.n_splits)
  n_splits: null

# === Method 3: DS-SGen with Importance Reweighting ===
importance_weighted:
  embedding_model: "all-MiniLM-L6-v2"  # 384-dim, from sentence-transformers
  classifier: "logistic_regression"
  classifier_C: 1.0                     # regularization strength (inverse)
  weight_clip_percentile: 95            # clip extreme weights at this percentile
  weight_clip_percentiles: [90, 95, 99] # sensitivity sweep
  n_splits: null                        # null = use sgen.n_splits

# === Epsilon Sweep ===
epsilon_sweep:
  epsilons: [0.25, 0.30, 0.35, 0.40]
  n_splits: 100

# === Reproducibility ===
seed: 42
