# Conda environment for DS-SGen.
#   conda env create -f environment.yml && conda activate dsgen
#
# Versions are those of the Linux (CUDA 12.4) environment used for entailment
# scoring and the 500-split evaluations. openai, python-dotenv and sentencepiece
# were not in that environment export (generation ran on a separate machine), so
# their versions are not recorded and they are left unpinned.
#
# Reproducing the tables and figures from the cached results needs only
# numpy, scipy, scikit-learn, matplotlib and pyyaml; paper_figures/make_figures.py
# also needs a LaTeX installation and paper_figures/check_fonts.py needs pypdf.
# The torch wheel below is the CUDA 12.4 build; use the CPU wheel if you have no GPU.
name: dsgen
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.8
      - pyyaml==6.0.3
      - transformers==5.5.0
      - tokenizers==0.22.2
      - huggingface-hub==1.9.0
      - safetensors==0.7.0
      - accelerate==1.13.0
      - datasets==4.8.4
      - sentence-transformers==5.3.0
      - tqdm==4.67.3
      - sentencepiece        # slow DeBERTa-v2 tokenizer (use_fast=False); version not recorded
      - openai               # generation only; version not recorded
      - python-dotenv        # reads OPENAI_API_KEY from .env; version not recorded
      - pypdf                # paper_figures/check_fonts.py only
